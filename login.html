<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Card Desk — Laser Power &amp; Infra · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--cobalt:#1c46d6;--deep:#0c1a45;--ink:#fff;--ink-2:rgba(255,255,255,.76);--dim:rgba(255,255,255,.56);--mute:rgba(255,255,255,.4);
  --line:rgba(255,255,255,.14);--line-2:rgba(255,255,255,.26);--glass:rgba(255,255,255,.07);--accent:#9fbaff;--red:#ff5b64;--rose:#ff6b81;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:"Space Grotesk","Inter",system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:20px;position:relative;
  background:radial-gradient(1100px 680px at 80% -12%,#2a58ee 0,transparent 58%),radial-gradient(900px 560px at -8% 108%,#25379e 0,transparent 55%),linear-gradient(180deg,#1c46d6,#0c1a45)}
canvas#sphere{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55}
.wrap{position:relative;z-index:2;width:100%;max-width:400px;border-radius:24px;background:rgba(12,22,60,.6);border:1px solid var(--line-2);backdrop-filter:blur(16px);
  box-shadow:0 30px 70px -22px rgba(3,8,28,.85);padding:40px 32px;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(16px)}}
.mark{width:54px;height:54px;border-radius:15px;margin:0 auto 16px;display:grid;place-items:center;background:#fff;box-shadow:0 10px 26px rgba(0,0,0,.35);position:relative}
.mark svg{width:28px;height:28px;color:var(--cobalt)}
.mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #0c1a45}
.lpi-logo{display:flex;align-items:center;background:#fff;border-radius:14px;padding:14px 18px;width:fit-content;max-width:100%;margin:0 auto 18px;box-shadow:0 14px 32px rgba(0,0,0,.4)}
.lpi-img{height:52px;width:auto;max-width:100%;display:block}
.lpi-logo svg{width:40px;height:40px;flex-shrink:0}
.lpi-wm{line-height:1.05;text-align:left}
.lpi-wm .r1{font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:.2px;white-space:nowrap}
.lpi-wm .r1 .a{color:#0e2a6b}.lpi-wm .r1 .b{color:#e2231a}
.lpi-wm .r2{font-size:.5rem;color:#33447a;letter-spacing:.5px;margin-top:3px;font-weight:700}
.co{font-family:var(--display);font-size:1.15rem;font-weight:700;text-align:center;letter-spacing:.4px;color:#fff}
.co .amp{color:var(--accent);font-weight:500}
h1{font-size:.95rem;font-weight:600;text-align:center;color:var(--ink-2);margin-top:10px}
.sub{text-align:center;color:var(--dim);font-size:.84rem;margin-top:4px;margin-bottom:26px}
label{display:block;font-size:.72rem;font-weight:700;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 7px}
.field{position:relative;display:flex;align-items:center}
.field .ic{position:absolute;left:14px;color:var(--mute);width:18px;height:18px}.field .ic svg{width:100%;height:100%}
input{width:100%;padding:14px 15px 14px 42px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:.95rem;font-family:var(--font);outline:none;transition:.2s}
input::placeholder{color:var(--mute)}
input:focus{border-color:var(--line-2);background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(255,255,255,.07)}
button{width:100%;margin-top:24px;padding:15px;border:none;border-radius:13px;cursor:pointer;font-weight:800;font-size:.98rem;font-family:var(--font);color:var(--cobalt);background:#fff;transition:.2s;display:flex;align-items:center;justify-content:center;gap:9px}
button:hover{filter:brightness(.97);box-shadow:0 12px 28px rgba(0,0,0,.4)}button:disabled{opacity:.6;cursor:not-allowed}
#msg{margin-top:15px;font-size:.85rem;color:#ffb0ba;text-align:center;min-height:20px;font-weight:500}
.foot{text-align:center;margin-top:22px;font-size:.68rem;color:var(--mute);letter-spacing:.5px;font-weight:600}
.tabs{display:flex;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:5px;margin:0 0 22px}
.tab{flex:1;width:auto;margin:0;padding:11px;border:none;border-radius:9px;background:transparent;color:var(--dim);font-weight:700;font-size:.85rem;cursor:pointer;transition:.15s;box-shadow:none}
.tab.active{background:#fff;color:var(--cobalt)}
.tab:hover{filter:none}
#msg2{margin-top:15px;font-size:.85rem;text-align:center;min-height:20px;font-weight:600;color:var(--dim)}
.or{display:flex;align-items:center;gap:12px;margin:22px 0 15px;color:var(--mute);font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;margin:0;padding:13px;border:1px solid var(--line-2);border-radius:13px;background:#fff;color:#1f2b45;font-weight:700;font-size:.92rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:11px;font-family:var(--font);transition:.15s}
.gbtn:hover{filter:brightness(.97);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.gbtn svg{width:19px;height:19px}
#gmsg{margin-top:13px;font-size:.85rem;text-align:center;min-height:18px;font-weight:600;color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

    <div class="field"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><input id="su-pass" type="password" autocomplete="new-password" placeholder="Create a password" required></div>
    <button id="btn2"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM19 8v6M22 11h-6"/></svg>Create Account</button>

    <svg viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.4 6.6-16.1z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2v-5.7H4.5C3 17.1 2.1 20.4 2.1 24s.9 6.9 2.4 9.9l7.3-5.7z"/><path fill="#EA4335" d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.4 2 8.1 6.9 4.5 14.1l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/></svg>

<script>
"use strict";
function initSphere(cv){const ctx=cv.getContext("2d");let raf,W,H,cx,cy,R,dpr;const S=150,D=100;const seed=[];for(let i=0;i<S;i++)seed.push(Math.random()*Math.PI*2);let t=0;const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;cx=W/2;cy=H/2;R=Math.min(W,H)*0.36;}
  function draw(){ctx.clearRect(0,0,W,H);t+=0.0014;
    for(let i=0;i<S;i++){const a=seed[i]+t;const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;ctx.strokeStyle="rgba(255,255,255,"+(0.04+0.1*Math.abs(Math.sin(a*2.3+t*4)))+")";ctx.lineWidth=dpr*0.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(cx,cy);ctx.stroke();}
    for(let i=0;i<D;i++){const a=(i/D)*Math.PI*2+t*0.5;const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;const tw=0.5+0.5*Math.sin(t*5+i*0.7);ctx.fillStyle="rgba(255,255,255,"+(0.25+0.5*tw)+")";ctx.beginPath();ctx.arc(x,y,dpr*1.3,0,7);ctx.fill();}
    if(!reduce)raf=requestAnimationFrame(draw);}
  size();draw();let to;addEventListener("resize",()=>{clearTimeout(to);to=setTimeout(()=>{cancelAnimationFrame(raf);size();draw();},120);});}
initSphere(document.getElementById("sphere"));
async function doLogin(e){e.preventDefault();const btn=document.getElementById("btn"),msg=document.getElementById("msg");btn.disabled=true;msg.textContent="";
  try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("u").value,password:document.getElementById("p").value})});
    if(r.ok){location.href="/";return;}msg.textContent="Invalid username or password.";}catch(err){msg.textContent="Server error — please try again.";}
  btn.disabled=false;}
const SIGNUP_URL="";   // optional Apps Script /exec webhook to store sign-ups in your Google Sheet
function showAuth(w){const isIn=w==="in";
  document.getElementById("form-in").style.display=isIn?"":"none";
  document.getElementById("form-up").style.display=isIn?"none":"";
  document.getElementById("tab-in").classList.toggle("active",isIn);
  document.getElementById("tab-up").classList.toggle("active",!isIn);
  document.getElementById("sub").textContent=isIn?"Sign in to access your directory":"Create your account to get started";}
function val(id){return (document.getElementById(id).value||"").trim();}
async function doSignup(e){e.preventDefault();
  const btn=document.getElementById("btn2"),msg=document.getElementById("msg2");
  const name=val("su-name"),email=val("su-email"),phone=val("su-phone"),pass=val("su-pass");
  if(!name||!email||!phone||!pass){msg.style.color="#ffb0ba";msg.textContent="Please fill in all fields.";return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.style.color="#ffb0ba";msg.textContent="Please enter a valid email.";return;}
  if(pass.length<6){msg.style.color="#ffb0ba";msg.textContent="Password must be at least 6 characters.";return;}
  btn.disabled=true;msg.style.color="var(--dim)";msg.textContent="Creating your account…";
  try{
    if(SIGNUP_URL){await fetch(SIGNUP_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({type:"signup",name:name,email:email,phone:phone})});}
    msg.style.color="#3ddc97";msg.textContent="✓ Account request submitted — we'll get you set up shortly.";
    e.target.reset();
  }catch(err){msg.style.color="#ffb0ba";msg.textContent="Couldn't submit — please try again.";}
  btn.disabled=false;}
const GOOGLE_CLIENT_ID="265969045892-o2da4je472sp3jhuhe4mk5v5skf9772q.apps.googleusercontent.com";   // Google OAuth Web Client ID
function gmsg(m,cls){const g=document.getElementById("gmsg");g.style.color=cls==="ok"?"#3ddc97":cls==="err"?"#ffb0ba":"var(--dim)";g.textContent=m;}
let G_TC=null;
function googleSignIn(){
  if(!GOOGLE_CLIENT_ID){gmsg("Add your Google Client ID to switch this on.","err");return;}
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){gmsg("Google is still loading — try again in a moment.","err");return;}
  gmsg("Opening Google…");
  if(!G_TC)G_TC=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:"https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile",callback:async function(r){
    if(!r||r.error){gmsg("Google sign-in cancelled.","err");return;}
    try{const u=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+r.access_token}}).then(x=>x.json());
      gmsg("Signing you in as "+(u.name||u.email)+"…","ok");
      const lr=await fetch("/api/google-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token:r.access_token})});
      if(lr.ok){gmsg("✓ Signed in — opening your directory…","ok");location.href="/";}
      else{gmsg("Signed in with Google, but sign-in to the app failed. Try again.","err");}
    }catch(e){gmsg("Couldn't complete Google sign-in.","err");}
  }});
  G_TC.requestAccessToken();}
</script>
