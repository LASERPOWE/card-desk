<style>
:root{--cobalt:#1c46d6;--deep:#0c1a45;--ink:#fff;--dim:rgba(255,255,255,.62);--mute:rgba(255,255,255,.42);--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.06);--accent:#9fbaff;--green:#3ddc97;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:"Space Grotesk","Inter",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);min-height:100vh;background:radial-gradient(1100px 700px at 82% -14%,#294fd6 0,transparent 56%),radial-gradient(900px 600px at -10% 112%,#22357f 0,transparent 55%),linear-gradient(180deg,#12245b,#0a1636)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:13px 18px;background:rgba(9,17,44,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;background:#fff;border-radius:11px;padding:6px 12px}
.logo img{height:28px;width:auto;display:block}
.htxt{display:flex;flex-direction:column;line-height:1.15}
.htxt b{font-family:var(--display);font-weight:700;font-size:1rem}
.htxt span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.badge-u{margin-left:auto;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:6px 13px;background:var(--glass)}
main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.hero{padding:20px 4px 22px}
.hero .eye{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero h1{font-family:var(--display);font-size:2rem;margin-top:8px;line-height:1.1}
.hero p{color:var(--dim);margin-top:8px;max-width:560px;font-size:.94rem}
.search{position:relative;margin:18px 0 22px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute)}
.search input{width:100%;padding:15px 16px 15px 46px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:.98rem;font-family:inherit;outline:none}
.search input:focus{border-color:var(--accent);background:rgba(255,255,255,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:rgba(12,22,60,.55);border:1px solid var(--line);border-radius:18px;padding:18px;transition:.18s;animation:up .4s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 18px 40px -20px rgba(0,0,0,.7)}
.ctop{display:flex;align-items:center;gap:13px}
.av{width:48px;height:48px;border-radius:13px;flex:none;display:grid;place-items:center;font-weight:800;font-size:1.05rem;background:linear-gradient(135deg,#2a58ee,#1a2f8f);color:#fff}
.nm{font-weight:700;font-size:1.05rem;line-height:1.2}
.role{color:var(--dim);font-size:.85rem;margin-top:2px}
.meta{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.mrow{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:.86rem;word-break:break-word}
.mrow svg{width:15px;height:15px;flex:none;color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.act{flex:1;min-width:84px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--glass);color:#fff;font-weight:600;font-size:.82rem;cursor:pointer;text-decoration:none;transition:.15s;font-family:inherit}
.act:hover{background:rgba(255,255,255,.12);border-color:var(--accent)}
.act svg{width:15px;height:15px}
.act.save{background:#fff;color:var(--cobalt);border-color:#fff}
.act.save:hover{filter:brightness(.96)}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px 20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#0e2154;border:1px solid var(--line);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;z-index:40;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){.hero h1{font-size:1.6rem}}
</style>
</head>

  <div class="htxt"><b>Card Desk</b><span>Directory</span></div>
  <div class="badge-u">User View</div>
</header>
<main>
  <div class="hero">
    <div class="eye">Laser Power &amp; Infra</div>
    <h1>Find &amp; save contacts</h1>
    <p>Browse the directory, then tap <b>Save contact</b> to add anyone straight to your phone — name, title, company, phone and email included.</p>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" placeholder="Search name, company, city…" autocomplete="off" oninput="render()">
  </div>
  <div class="grid" id="grid"></div>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
let CARDS=[];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const IC={phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-8H5v8M17 3v5H7M5 3h11l3 3v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></svg>'};
function ico(n){const s=document.createElement("span");s.innerHTML=IC[n];return s.firstChild;}
function initials(n){return (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("on"),2200);}

// vCard (3.0, CRLF) — same format that saves cleanly on iPhone & Android
function vEsc(s){return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}
function vMulti(s){return String(s||"").split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);}
function vcard(c){const nm=(c.full_name||"Contact").trim(),p=nm.split(/\s+/),first=p[0]||nm,last=p.length>1?p.slice(1).join(" "):"";
  const v=["BEGIN:VCARD","VERSION:3.0","N:"+vEsc(last)+";"+vEsc(first)+";;;","FN:"+vEsc(nm)];
  if(c.company)v.push("ORG:"+vEsc(c.company));
  if(c.designation)v.push("TITLE:"+vEsc(c.designation));
  vMulti(c.mobile).forEach(t=>v.push("TEL;TYPE=CELL:"+vEsc(t)));
  vMulti(c.office_phones).forEach(t=>v.push("TEL;TYPE=WORK:"+vEsc(t)));
  vMulti(c.emails).forEach(e=>v.push("EMAIL;TYPE=WORK:"+vEsc(e)));
  if(c.city||c.country)v.push("ADR;TYPE=WORK:;;;"+vEsc(c.city)+";;;"+vEsc(c.country));
  if(c.website)v.push("URL:"+vEsc(c.website));
  v.push("END:VCARD");return v.join("\r\n");}
function saveContact(c){const blob=new Blob([vcard(c)],{type:"text/vcard;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(c.full_name||"contact").replace(/[^a-z0-9]+/gi,"_").toLowerCase()+".vcf";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast("Contact saved — open the file to add "+(c.full_name||"")); }

function match(c,q){if(!q)return true;return ["full_name","company","designation","city","country","emails","mobile"].some(f=>String(c[f]||"").toLowerCase().includes(q));}
function render(){const q=(document.getElementById("q").value||"").trim().toLowerCase();const grid=document.getElementById("grid");grid.replaceChildren();
  const list=CARDS.filter(c=>match(c,q)).sort((a,b)=>String(a.full_name||"").localeCompare(String(b.full_name||"")));
  if(!list.length){const e=el("div","empty",CARDS.length?"No matches — try another search.":"No contacts yet.");grid.appendChild(e);return;}
  list.forEach((c,i)=>{const card=el("div","card");card.style.animationDelay=Math.min(i*30,300)+"ms";
    const top=el("div","ctop");const av=el("div","av",initials(c.full_name));top.appendChild(av);
    const who=el("div");who.style.minWidth="0";who.appendChild(el("div","nm",c.full_name||"Unknown"));
    const role=[c.designation,c.company].filter(Boolean).join(" · ");if(role)who.appendChild(el("div","role",role));
    top.appendChild(who);card.appendChild(top);
    const meta=el("div","meta");const mrow=(n,t)=>{if(!t)return;const r=el("div","mrow");r.appendChild(ico(n));r.appendChild(el("span",null,t));meta.appendChild(r);};
    mrow("phone",c.mobile||c.office_phones);mrow("mail",c.emails);mrow("pin",[c.city,c.country].filter(Boolean).join(", "));
    if(meta.children.length)card.appendChild(meta);
    const acts=el("div","acts");
    const ph=(vMulti(c.mobile)[0]||vMulti(c.office_phones)[0]||"");
    if(ph){const a=document.createElement("a");a.className="act";a.href="tel:"+ph.replace(/\s+/g,"");a.appendChild(ico("phone"));a.appendChild(el("span",null,"Call"));acts.appendChild(a);}
    const em=(vMulti(c.emails)[0]||"");
    if(em){const a=document.createElement("a");a.className="act";a.href="mailto:"+em;a.appendChild(ico("mail"));a.appendChild(el("span",null,"Email"));acts.appendChild(a);}
    const sv=el("button","act save");sv.appendChild(ico("save"));sv.appendChild(el("span",null,"Save contact"));sv.onclick=()=>saveContact(c);acts.appendChild(sv);
    card.appendChild(acts);grid.appendChild(card);});}

async function load(){try{const r=await fetch("/api/cards",{headers:{Accept:"application/json"}});
  if(!r.ok||r.redirected||!(r.headers.get("content-type")||"").includes("application/json")){location.href="/login";return;}
  CARDS=(await r.json()).cards||[];render();}catch(e){document.getElementById("grid").innerHTML='<div class="empty">Couldn\'t load the directory.</div>';}}
load();
</script>
</body>
